<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tools Directory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .link-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .link-card a {
            text-decoration: none;
            color: #2980b9;
            font-size: 18px;
            font-weight: bold;
            display: block;
        }
        .link-card a:hover {
            color: #1a5276;
        }
    </style>
</head>
<body>

    <h1>Tools Directory</h1>
    
    <div class="link-container">
        <div class="link-card">
            <a href="https://ls-froilan-fajardo.github.io/item-export-breakdown/" target="_blank">Item Export Breakdown</a>
        </div>

        <div class="link-card">
            <a href="https://ls-froilan-fajardo.github.io/gift-card-QR-code-generator/" target="_blank">Gift Card QR Code Generator</a>
        </div>

        <div class="link-card">
            <a href="https://ls-froilan-fajardo.github.io/payments-discrepancy/" target="_blank">Payments Discrepancy</a>
        </div>

        <div class="link-card">
            <a href="https://ls-froilan-fajardo.github.io/FS-Reconciliation/" target="_blank">FS Reconciliation</a>
        </div>
    </div>

</body>
</html>
